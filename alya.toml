[package]
name = "datatypes"
version = "0.1.0"
alya-version = "0.0.20"
entry = "src/lib.alya"
description = "Advanced data structures for Alya: RingBuffer, DoublyLinkedList, Trie, BitSet, BloomFilter and more"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/datatypes"
keywords = ["alya", "alya-lang", "package", "datatypes", "collections", "ringbuffer", "trie", "bitset", "bloomfilter", "linkedlist"]

[dependencies]

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`
# and `src/types.alya`). `default` is active unless the caller passes
# `--no-default-features`; select features explicitly via
# `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["ring_buffer", "linked_list", "trie", "bit_set", "bloom_filter"]
ring_buffer = []
linked_list = []
trie = []
bit_set = []
# Bloom filter hashing runs on top of the bit-set words.
bloom_filter = ["bit_set"]

